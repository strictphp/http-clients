name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
      fail-fast: false

    name: PHP ${{ matrix.php }} tests
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --no-progress --prefer-dist
      - run: composer test

  lowest_dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
      fail-fast: false

    name: PHP ${{ matrix.php }} lowest Dependencies test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # strictphp/conventions is a lint-only tool requiring PHP >= 8.3 and this job runs tests only
      - if: matrix.php == '8.2'
        run: composer remove --dev strictphp/conventions --no-update

      - run: composer update --no-progress --prefer-dist --prefer-lowest --prefer-stable
      - run: composer test
